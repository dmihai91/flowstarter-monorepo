##############################################################################
# staging-migrate.yml
#
# Applies supabase/migrations to the STAGING Supabase project, so a Netlify
# Deploy Preview always talks to a database whose schema matches the branch
# that produced it.
#
# The preview environment, in one paragraph. Every pull request gets a Netlify
# Deploy Preview (context `deploy-preview`); every non-production branch build
# gets a branch deploy (context `branch-deploy`). Both contexts are configured
# with the staging Supabase project's URL and keys, so no preview build can
# reach production data. The production context keeps its own values and is
# never touched by this lane. Clerk (development instance) and Stripe (test
# mode) are shared with production until launch; docs/preview-environment.md
# records that as a launch blocker for Clerk.
#
# Secrets this lane reads, all from Depot's own store (`depot ci secrets add
# ... --repo DMPResearch/flowstarter`), never GitHub's:
#   SUPABASE_ACCESS_TOKEN          personal access token for the Supabase CLI
#   STAGING_SUPABASE_PROJECT_REF   the staging project ref, e.g. abcdefghijkl
#   STAGING_SUPABASE_DB_PASSWORD   the staging database password
# When any of the three is missing the lane warns and ends green: staging is
# not configured yet, and that is not a code defect.
#
# Runbook: docs/preview-environment.md
##############################################################################

name: Staging Migrations
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only: run `supabase db push --dry-run` and change nothing.'
        type: boolean
        default: true
# One migration run at a time, and never cancel one in flight: a half-applied
# migration is worse than a queued one.
concurrency:
  group: staging-migrate-depot
  cancel-in-progress: false
# This lane reads the repository and writes to Supabase over the CLI. It needs
# no GitHub write scope at all.
permissions:
  contents: read
jobs:
  migrate:
    name: Apply migrations to staging
    runs-on: depot-ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Is staging configured at all?
      #
      # The `secrets` context cannot be read from a step-level `if`, so
      # presence becomes an output here and every later step gates on it. A
      # missing secret warns and skips; it never paints the lane red.
      - name: Check the staging credentials
        id: creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_SUPABASE_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          STAGING_SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$STAGING_SUPABASE_PROJECT_REF" ] || missing="$missing STAGING_SUPABASE_PROJECT_REF"
          [ -n "$STAGING_SUPABASE_DB_PASSWORD" ] || missing="$missing STAGING_SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::warning::Staging is not configured yet (missing:$missing). See docs/preview-environment.md for the one-time setup. Skipping."
            echo "Staging is not configured yet (missing:$missing). See docs/preview-environment.md." >> "$GITHUB_STEP_SUMMARY"
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      # Pinned to the same version the quality gate uses, so a migration that
      # applies locally under CI applies here under the same CLI.
      - name: Install the Supabase CLI
        if: steps.creds.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4
      # `supabase link` reads SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD
      # from the environment, so neither ever appears on a command line or in
      # a log line.
      - name: Link the staging project
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$PROJECT_REF"
      # A manual run defaults to planning only. A push to main that touched
      # the schema applies for real: that is the point of the lane.
      - name: Push migrations
        if: steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run: planning only, nothing is applied."
            echo "### Staging migrations (dry run)" >> "$GITHUB_STEP_SUMMARY"
            supabase db push --dry-run
          else
            echo "### Staging migrations (applied)" >> "$GITHUB_STEP_SUMMARY"
            supabase db push
          fi
      - name: Migration status
        if: always() && steps.creds.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
        run: |
          {
            echo ''
            echo '```'
            supabase migration list
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
