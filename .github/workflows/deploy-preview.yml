##############################################################################
# deploy-preview.yml
#
# Creates a Railway preview environment for every PR.
# The preview URL is posted as a PR comment and consumed by e2e-smoke.yml.
#
# Requirements (Railway CLI):
#   RAILWAY_TOKEN     — service account token with deploy access
#   RAILWAY_PROJECT_ID — project ID (same for all preview envs)
#
# The preview deployment is torn down when the PR closes.
#
# NOTE: production deploys now run on Netlify (see netlify.toml). This
# workflow is only used to spin up ephemeral PR previews on Railway. If/when
# Netlify Deploy Previews replace it, this file can be deleted.
##############################################################################

name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, master]

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  deploy:
    name: Deploy PR Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      preview-url-main: ${{ steps.deploy-main.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ── Deploy flowstarter-main ──────────────────────────────────────────
      - name: Deploy flowstarter-main preview
        id: deploy-main
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          URL=$(railway up \
            --service flowstarter-main \
            --environment "pr-${PR_NUM}" \
            --detach \
            --json | jq -r '.url')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "Main preview: ${URL}"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

      - name: Publish preview URL to job summary
        run: |
          {
            echo "## Preview Deployment"
            echo
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| flowstarter-main | ${{ steps.deploy-main.outputs.url }} |"
            echo
            echo "PR comment is best-effort and may be skipped when GitHub token permissions are restricted."
          } >> "$GITHUB_STEP_SUMMARY"

      # ── Comment on PR with preview URL ──────────────────────────────────
      - name: Comment preview URL on PR
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const mainUrl = '${{ steps.deploy-main.outputs.url }}';
            const body = [
              '## 🚀 Preview Deployment',
              '',
              '| Service | URL |',
              '|---------|-----|',
              `| flowstarter-main | [${mainUrl}](${mainUrl}) |`,
              '',
              '> This preview is torn down when the PR closes.',
              '> E2E smoke tests will run against this URL automatically.',
            ].join('\n');

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find(c =>
                c.user?.login === 'github-actions[bot]' &&
                c.body?.includes('Preview Deployment')
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              core.warning(`Unable to post preview comment: ${error.message}`);
            }

  # ── Teardown preview on PR close ─────────────────────────────────────────
  teardown:
    name: Teardown PR Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Remove preview environment
        run: |
          railway environment delete pr-${{ github.event.pull_request.number }} --yes || true
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
