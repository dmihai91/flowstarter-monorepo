##############################################################################
# e2e-smoke.yml
#
# Runs on every PR and push to main.
# Tests the full concierge flow end-to-end with MOCKED AI and Daytona.
#
# Covers:
#   - Scenario 1: Dashboard handoff → editor (token issuance, validation,
#                  tamper/expiry rejection, review screen, build trigger)
#   - Scenario 2: QuickScaffold → enrich → handoff → editor
#   - Scenario 3: Review-first → Build Site
#   - Editor integration: modification flow, restoration, agent streaming,
#                          terminal panel
#   - ClientQuickEditor: constrained editing guardrails
#
# Does NOT hit Claude AI or Daytona (Scenario 4 is in e2e-real-build.yml).
##############################################################################

name: E2E Smoke — Concierge Flow

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build editor-engine
        run: pnpm --dir packages/editor-engine build

      - name: Install Playwright browsers
        run: pnpm --dir apps/flowstarter-editor exec playwright install chromium --with-deps

      # ── Cross-app scenarios 1-3 (real Supabase/Convex, mocked AI/Daytona) ──

      - name: E2E — Cross-app scenarios (1-3)
        continue-on-error: true
        run: pnpm --dir apps/flowstarter-editor test:e2e:cross-app --grep-invert 'Scenario 4'
        env:
          CI: true
          # Main platform — points at deployed staging or preview URL
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://staging.flowstarter.dev' }}
          # Editor — points at deployed URL; no local server is started in CI
          PLAYWRIGHT_E2E_EDITOR_URL: ${{ secrets.EDITOR_URL || 'https://editor.flowstarter.dev' }}
          # Auth bypass (only works in non-production)
          E2E_SECRET: ${{ secrets.E2E_SECRET }}
          E2E_USER_ID: ${{ secrets.E2E_USER_ID }}
          HANDOFF_SECRET: ${{ secrets.HANDOFF_SECRET }}
          # Clerk (for global-setup)
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Editor runtime env
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}
          CONVEX_SITE_URL: ${{ secrets.CONVEX_SITE_URL }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}

      # ── Editor integration tests (fully mocked, no external services) ──────

      - name: E2E — Editor integration tests (mocked)
        run: pnpm --dir apps/flowstarter-editor test:e2e:integration
        env:
          CI: true

      # ── Artifacts ────────────────────────────────────────────────────────

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-smoke
          path: apps/flowstarter-editor/playwright-report/
          retention-days: 14

      - name: Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-smoke
          path: apps/flowstarter-editor/test-results/
          retention-days: 7

  # ── Platform smoke (main app routes, no editor) ───────────────────────────
  platform-smoke:
    name: Platform Smoke — flowstarter-main routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --dir . exec playwright install chromium --with-deps

      - name: E2E — Platform smoke (landing, auth guards, pricing)
        run: pnpm exec playwright test --config playwright.config.ts
        env:
          CI: true
          # These tests run against the deployed URL, not a local server
          PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://staging.flowstarter.dev' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-platform-smoke
          path: playwright-report/
          retention-days: 14
