##############################################################################
# e2e-smoke.yml
#
# Runs on every PR and push to main / feature branches.
# Hits the deployed flowstarter-main URL (preview or production) and verifies
# that the public surface is up:
#   - Landing page renders
#   - Auth-gated dashboards redirect unauthenticated users to login
#   - Pricing page renders
#
# This intentionally does NOT spin up a local Next dev server in CI — it
# relies on PLAYWRIGHT_BASE_URL pointing at a real deploy (preview or prod).
##############################################################################

name: E2E Smoke — Concierge Flow

on:
  push:
    branches: [main, master, 'feature/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: e2e-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── Platform smoke (main app routes) ──────────────────────────────────────
  platform-smoke:
    name: Platform Smoke — flowstarter-main routes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: E2E — Platform smoke (landing, auth guards, pricing)
        run: pnpm exec playwright test --config playwright.config.ts
        env:
          CI: true
          # These tests run against a deployed URL, not a local server.
          PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_BASE_URL || 'https://flowstarter.dev' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-platform-smoke
          path: playwright-report/
          retention-days: 14
