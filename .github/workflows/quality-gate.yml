##############################################################################
# quality-gate.yml
#
# Runs on every PR and push to main/feature branches.
# Blocks merge if lint, typecheck, unit tests, or tenant isolation fail.
#
# Steps:
#   1. Lint  — flowstarter-main
#   2. Typecheck — flow-design-system + flowstarter-main
#   3. Unit tests — flowstarter-main (vitest)
#   4. Tenant isolation — real local Supabase stack + verify-rls-local.mjs
##############################################################################

name: Quality Gate

on:
  push:
    branches: [main, master, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint — flowstarter-main
        run: pnpm --dir apps/flowstarter-main lint
        continue-on-error: true
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'

  # ── 2. Typecheck ──────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck — flowstarter-main
        run: pnpm nx run flowstarter-main:typecheck

  # ── 3. Unit tests ─────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests — flowstarter-main
        run: pnpm nx run flowstarter-main:test
        env:
          # Optional — tests mock Supabase but some imports need the env var defined
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-flowstarter-main
          path: |
            apps/flowstarter-main/coverage/
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-flowstarter-main
          path: apps/flowstarter-main/test-results/
          retention-days: 7

  # ── 4. Tenant isolation ───────────────────────────────────────────────────
  # Proves tenant B cannot read tenant A's rows, by direct query (RLS, via a
  # real local Postgres + PostgREST) or via the API (requireWorkspaceAccess in
  # unit-tests, above). This job is the direct-query half; it runs migrations
  # against a throwaway local stack on every run — there is no persistent CI
  # database to accumulate drift against.
  tenant-isolation:
    name: Tenant Isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      - name: Start local Supabase stack (applies all migrations)
        # verify-rls-local.mjs only ever talks to Kong (the API gateway on
        # 54321, proxying to PostgREST) and Postgres directly. It mints its
        # own HS256 JWTs rather than signing in through GoTrue, and never
        # touches storage, realtime, imgproxy, studio, or the log stack —
        # excluding them here is a real time saving, not a correctness risk.
        # Flag name and the exact exclude list confirmed against
        # `supabase start --help` (CLI 2.95.4):
        #   -x, --exclude strings   [gotrue,realtime,storage-api,imgproxy,
        #     kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,
        #     logflare,vector,supavisor]
        # kong and postgrest are deliberately kept: the script's API_URL is
        # the Kong-fronted REST endpoint.
        run: |
          supabase start \
            --exclude gotrue,realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Verify RLS — tenant B cannot read tenant A's rows
        run: node apps/flowstarter-main/scripts/verify-rls-local.mjs

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop
