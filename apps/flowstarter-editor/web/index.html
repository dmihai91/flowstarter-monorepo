<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ef" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#040308" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#040308" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-16x16.png" type="image/png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        /* Match `--fs-bg-base` in index.css so first paint + html canvas align with FlowBackground. */
        const LIGHT_BACKGROUND = "#fbf7ef";
        const DARK_BACKGROUND = "#040308";
        const themeColorMeta = document.querySelector('meta[name="theme-color"]');
        try {
          const storedTheme = window.localStorage.getItem("flowstarter-editor:theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark" || storedTheme === "system"
              ? storedTheme
              : "system";
          const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          const isDark = theme === "dark" || (theme === "system" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
          const chromeColor = isDark ? DARK_BACKGROUND : LIGHT_BACKGROUND;
          document.documentElement.style.backgroundColor = chromeColor;
          themeColorMeta?.setAttribute("content", chromeColor);
        } catch {
          document.documentElement.classList.add("dark");
          document.documentElement.style.backgroundColor = DARK_BACKGROUND;
          themeColorMeta?.setAttribute("content", DARK_BACKGROUND);
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        background: #fbf7ef;
        color: #262626;
        font-family:
          "Plus Jakarta Sans",
          "Plus Jakarta Sans Variable",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          system-ui,
          sans-serif;
      }

      html.dark body {
        background: #040308;
        color: rgba(255, 255, 255, 0.92);
      }

      #boot-shell {
        display: flex;
        min-height: 100%;
        align-items: center;
        justify-content: center;
        background: inherit;
      }

      #boot-shell-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      #boot-shell-logo {
        width: 40px;
        height: 40px;
        border-radius: 11px;
        background: linear-gradient(135deg, #7c3aed 0%, #7c3aed 50%, #06b6d4 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 700;
        font-size: 20px;
        font-family: "Plus Jakarta Sans", "Plus Jakarta Sans Variable", system-ui, sans-serif;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12) inset,
          0 1px 3px rgba(0, 0, 0, 0.06);
      }

      #boot-shell-name {
        font-size: 18px;
        font-weight: 600;
        opacity: 0.8;
      }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Onest:wght@300..800&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400..700&display=swap"
      rel="stylesheet"
    />
    <meta name="application-name" content="Flowstarter | Smart AI Editor" />
    <meta property="og:title" content="Flowstarter | Smart AI Editor" />
    <meta name="twitter:title" content="Flowstarter | Smart AI Editor" />
    <meta name="apple-mobile-web-app-title" content="Flowstarter | Smart AI Editor" />
    <title>Flowstarter | Smart AI Editor</title>
  </head>
  <body>
    <!-- React portals FlowstarterFlowBg here so mesh sits under #root (whole shell, not inset-only). -->
    <div id="fs-flow-bg-mount"></div>
    <div id="root">
      <div id="boot-shell">
        <div id="boot-shell-card" aria-label="Flowstarter loading">
          <div id="boot-shell-logo">F</div>
          <span id="boot-shell-name">Flowstarter</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
