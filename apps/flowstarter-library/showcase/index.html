<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  <script>
    (function() {
      try {
        // Check cookie first (synced across subdomains)
        var cookie = document.cookie.split(';').map(function(s){ return s.trim(); })
          .find(function(s){ return s.startsWith('flowstarter_theme='); });
        var cookieVal = cookie ? cookie.split('=')[1] : null;
        var stored = cookieVal || localStorage.getItem('theme') || localStorage.getItem('flowstarter_theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored === 'dark' || (!stored && prefersDark) || (stored === 'system' && prefersDark);
        if (isDark) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
        // Prevent flash: hide body until first paint
        document.documentElement.style.setProperty('--theme-ready', '0');
      } catch(e) {}
    })();
  </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Browse and preview beautiful, professionally crafted website templates from the Flowstarter Library."
    />
    <meta name="theme-color" content="#8b5cf6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&display=swap"
      rel="stylesheet"
    />
    <title>Flowstarter Library</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
