<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Brand gradient — exact mirror of the sidebar logo:
         linear-gradient(135deg, hsl(233,65%,50%) 0%, hsl(233,75%,60%) 50%, hsl(180,65%,55%) 100%)
         which in SVG userSpace coords (135deg = top-left → bottom-right) is x1=0,y1=0 → x2=40,y2=40. -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4D5DD9"/>
      <stop offset="0.5" stop-color="#7283E5"/>
      <stop offset="1" stop-color="#3FC4C4"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="40" height="40" rx="11" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="38" height="38" rx="10" fill="none" stroke="rgba(255,255,255,0.32)" stroke-width="1"/>
  <!-- Stylized "F" — matches the FlowstarterWordmark component in Sidebar.tsx -->
  <path d="M13 10 L13 30" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <path d="M13 11 C17 10, 22 10, 27 11" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M13 20 C16 19, 20 19, 24 20" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M13 30 C16 30, 20 29, 25 28" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
</svg>
