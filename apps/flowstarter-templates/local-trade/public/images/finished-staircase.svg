<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Finished oak staircase in a hallway">
  <defs>
    <linearGradient id="st-wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ead8"/>
      <stop offset="1" stop-color="#e6dbbf"/>
    </linearGradient>
    <linearGradient id="st-tread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e7a45a"/>
      <stop offset="1" stop-color="#c47b30"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#st-wall)"/>
  <!-- window light -->
  <rect x="520" y="70" width="200" height="260" rx="6" fill="#fbf3df"/>
  <line x1="620" y1="70" x2="620" y2="330" stroke="#d8c8a6" stroke-width="6"/>
  <line x1="520" y1="200" x2="720" y2="200" stroke="#d8c8a6" stroke-width="6"/>
  <!-- staircase stringer -->
  <path d="M70 760 L70 560 L210 560 L350 420 L490 280 L630 140 L700 140 L700 760 Z" fill="#2c241d"/>
  <!-- treads -->
  <g fill="url(#st-tread)">
    <rect x="70" y="552" width="160" height="22"/>
    <rect x="140" y="482" width="160" height="22"/>
    <rect x="210" y="412" width="160" height="22"/>
    <rect x="280" y="342" width="160" height="22"/>
    <rect x="350" y="272" width="160" height="22"/>
    <rect x="420" y="202" width="160" height="22"/>
    <rect x="490" y="132" width="160" height="22"/>
  </g>
  <!-- risers -->
  <g fill="#3a2f24">
    <rect x="70" y="574" width="160" height="58"/>
    <rect x="140" y="504" width="160" height="58"/>
    <rect x="210" y="434" width="160" height="58"/>
    <rect x="280" y="364" width="160" height="58"/>
    <rect x="350" y="294" width="160" height="58"/>
    <rect x="420" y="224" width="160" height="58"/>
  </g>
  <!-- handrail -->
  <path d="M120 520 L600 100" stroke="#d98a3d" stroke-width="16" stroke-linecap="round"/>
  <!-- balusters -->
  <g stroke="#211b16" stroke-width="8">
    <line x1="170" y1="540" x2="170" y2="470"/>
    <line x1="240" y1="470" x2="240" y2="400"/>
    <line x1="310" y1="400" x2="310" y2="330"/>
    <line x1="380" y1="330" x2="380" y2="260"/>
    <line x1="450" y1="260" x2="450" y2="190"/>
    <line x1="520" y1="190" x2="520" y2="120"/>
  </g>
  <!-- newel post -->
  <rect x="100" y="500" width="40" height="260" rx="4" fill="#211b16"/>
  <rect x="92" y="486" width="56" height="26" rx="4" fill="#d98a3d"/>
</svg>
