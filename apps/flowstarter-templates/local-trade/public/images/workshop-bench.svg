<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Joinery workbench with tools and timber">
  <defs>
    <linearGradient id="wb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe7d4"/>
      <stop offset="1" stop-color="#e3d6b8"/>
    </linearGradient>
    <linearGradient id="wb-wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98a3d"/>
      <stop offset="1" stop-color="#b96d28"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#wb-sky)"/>
  <!-- back wall planks -->
  <g stroke="#d8c8a6" stroke-width="2" opacity="0.7">
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
  </g>
  <!-- pegboard tools -->
  <g stroke="#211b16" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M120 90 L120 200 M95 200 L145 200"/>
    <path d="M210 80 L260 170 M210 170 L260 80"/>
    <rect x="320" y="80" width="120" height="40" rx="6" fill="#5c6b4f" stroke="none"/>
    <path d="M520 90 q40 -10 70 30 l-30 22 q-30 -40 -55 -22 z" fill="#211b16" stroke="none"/>
    <circle cx="660" cy="140" r="46"/>
    <path d="M660 100 L660 140 L690 160"/>
  </g>
  <!-- workbench -->
  <rect x="60" y="470" width="680" height="70" rx="6" fill="url(#wb-wood)"/>
  <rect x="60" y="470" width="680" height="14" fill="#e7a45a"/>
  <rect x="95" y="540" width="34" height="200" fill="#8a5320"/>
  <rect x="671" y="540" width="34" height="200" fill="#8a5320"/>
  <rect x="60" y="600" width="680" height="16" fill="#8a5320"/>
  <!-- timber stack on bench -->
  <g>
    <rect x="120" y="420" width="240" height="22" rx="3" fill="#e7a45a"/>
    <rect x="140" y="398" width="240" height="22" rx="3" fill="#d98a3d"/>
    <rect x="160" y="376" width="240" height="22" rx="3" fill="#c47b30"/>
  </g>
  <!-- hand plane -->
  <g transform="translate(470 414)">
    <rect x="0" y="30" width="170" height="34" rx="6" fill="#211b16"/>
    <rect x="55" y="6" width="36" height="40" rx="6" fill="#5c6b4f"/>
    <rect x="-6" y="56" width="182" height="10" rx="3" fill="#43362a"/>
  </g>
  <!-- shavings -->
  <g stroke="#e7a45a" stroke-width="5" fill="none" opacity="0.85">
    <path d="M250 470 q20 -26 46 -6 q22 18 -6 28"/>
    <path d="M600 470 q22 -24 44 -4 q20 18 -8 26"/>
  </g>
  <!-- floor -->
  <rect x="0" y="740" width="800" height="60" fill="#cdbb95"/>
</svg>
