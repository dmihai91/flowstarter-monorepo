# Shared nginx config for the Flowstarter editor — HTTP context.
# Install once: /etc/nginx/conf.d/flowstarter-shared.conf
#
# Provides:
#   - the WebSocket upgrade map used by every per-client server block
#   - Cloudflare real client IP restoration (origin sits behind CF)
#
# Without the $connection_upgrade map the per-site `proxy_set_header
# Connection $connection_upgrade;` would be undefined and websockets
# (the editor's live channel) would fail — so this file is required.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Cloudflare: trust CF edge, take the real visitor IP from
# CF-Connecting-IP. Refresh the ranges from
# https://www.cloudflare.com/ips/ (they change rarely). Keep this list
# current or rate-limiting / logging will see CF IPs, not visitors. ---
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
