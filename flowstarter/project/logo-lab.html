<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>body{display:flex;gap:40px;flex-wrap:wrap;align-items:center;padding:50px;background:#F5F4F9}
.row{display:flex;gap:30px;align-items:center}.dark{background:#0C0814;padding:30px;border-radius:20px}</style></head>
<body data-theme="studio">
<div id="big"></div>
<svg width="220" height="220" viewBox="0 0 24 24" fill="none" id="probe"></svg>
<script>
// candidate flowing-F paths rendered big for review
const grad='linear-gradient(135deg,#6D43DE,#9647CE)';
function tile(inner,bg){return `<div style="width:160px;height:160px;border-radius:42px;background:${bg};display:grid;place-items:center;box-shadow:0 10px 30px -8px #6D43DE">${inner}</div>`}
const F1=`<svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
<path d="M9.6 4.7 L 9.6 19.4"/>
<path d="M9.6 5 C 13 4.1, 16.6 4.2, 19.2 5.5"/>
<path d="M9.6 11.4 C 12.4 10.7, 15 10.8, 17.2 11.7"/></svg>`;
// filled tapering 'pennant' F — arms flow like speed/water lines
const F2=`<svg width="100" height="100" viewBox="0 0 24 24" fill="#fff">
<path d="M8 4.3 q-1 0 -1 1 v14 q0 1 1 1 t1 -1 v-14 q0 -1 -1 -1 z"/>
<path d="M8.6 4.3 C 13 3.6, 17.2 3.9, 20.4 5.1 C 17 5.7, 13 5.9, 9 6.4 Z"/>
<path d="M8.6 10.9 C 12.2 10.2, 15.4 10.4, 18 11.4 C 15 11.9, 12 12.1, 9 12.6 Z"/></svg>`;
document.getElementById('big').innerHTML='<div class="row">'+tile(F1,grad)+tile(F2,grad)+'<div class="dark">'+tile(F2,grad)+'</div></div>';
</script>
</body></html>
