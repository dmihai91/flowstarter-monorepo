# Local dev runner for the Flowstarter monorepo.
#
# Run `pnpm dev` to start everything that auto-starts. Optional procs are
# defined here too — toggle them on inside mprocs (highlight + `s`) only when
# you need them.
#
# Stripe webhook secret note: the first time `stripe listen` runs on this
# machine, copy the printed `whsec_...` into apps/flowstarter-main/.env.local
# as STRIPE_WEBHOOK_SECRET (one-time per machine; secret persists across
# CLI restarts), then restart the Main proc so Next.js picks up the env.
#
procs:
  "🏠 Main":
    shell: "pnpm dev:main"
    autostart: true

  "🗄️ Supabase":
    shell: "pnpm dev:supabase"
    autostart: true

  "💳 Stripe Webhooks":
    shell: "stripe listen --forward-to localhost:3000/api/webhooks/stripe"
    autostart: true

  "📦 Deploy Agent":
    # Bun service used on each Caddy host in production. Only start locally
    # when testing /api/team/projects/[id]/site/deploy. Requires bun.
    shell: "DEPLOY_AGENT_SHARED_SECRET=dev-secret DEPLOY_AGENT_SITES_ROOT=/tmp/fs-sites DEPLOY_AGENT_CADDY_SITES_DIR=/tmp/fs-caddy-sites DEPLOY_AGENT_CADDY_RELOAD_CMD='echo reloaded' pnpm --dir apps/deploy-agent dev"
    autostart: false

  "✏️  Editor":
    # Flowstarter editor (forked T3 Code) — server on :3773 (Bun) and web
    # client on :5733 (Vite), launched in parallel by the editor's own
    # workspace dev script. Toggle on inside mprocs when working on the
    # editor. Needs ANTHROPIC_API_KEY for the agent to do anything;
    # CLERK_SECRET_KEY + Supabase service role only matter once the Clerk
    # gate is wired.
    shell: "pnpm dev:editor"
    autostart: false
