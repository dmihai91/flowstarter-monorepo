# Local dev runner for the Flowstarter monorepo.
#
# Run `pnpm dev` to start everything that auto-starts. Optional procs are
# defined here too — toggle them on inside mprocs (highlight + `s`) only when
# you need them.
#
# Stripe webhook secret note: the first time `stripe listen` runs on this
# machine, copy the printed `whsec_...` into apps/flowstarter-main/.env.local
# as STRIPE_WEBHOOK_SECRET (one-time per machine; secret persists across
# CLI restarts), then restart the Main proc so Next.js picks up the env.
#
procs:
  "🏠 Main":
    shell: "pnpm dev:main"
    autostart: true

  "🗄️ Supabase":
    shell: "pnpm dev:supabase"
    autostart: true

  "💳 Stripe Webhooks":
    shell: "stripe listen --forward-to localhost:3000/api/webhooks/stripe"
    autostart: true

  "📦 Deploy Agent":
    # Bun service that emulates the on-host deploy agent. Auto-starts so
    # `/api/team/projects/[id]/site/deploy` works end-to-end in dev. Logs
    # are noisy because the Caddy reload command is a no-op (`echo
    # reloaded`); ignore those.
    #
    # DEPLOY_AGENT_STATIC_PORT is dev-only: on a real host Caddy serves the
    # extracted sites by hostname with TLS, but a laptop has no wildcard DNS
    # and the reload here is a no-op, so the agent also serves them by path at
    # http://localhost:8788/{slug}/.
    shell: "pnpm dev:deploy-agent"
    autostart: true

  "🔨 Build Worker":
    # Local-mode build worker: no GitHub, no Hetzner, no Pi key. Drains
    # FULL_SITE_BUILD jobs, packages the built site, and calls
    # /api/internal/build/deploy so the ordinary deploySite path puts it on the
    # deploy-agent above. Off by default because a build touches real
    # workspaces; start it (highlight + `s`) when exercising deposit → site.
    #
    # Needs FLOWSTARTER_BUILD_WORKER_SECRET (>= 32 chars, same value in
    # apps/flowstarter-main/.env.local) — see apps/build-worker/.env.example.
    shell: "pnpm dev:build-worker:local"
    autostart: false

  "✏️  Editor":
    # Flowstarter editor (forked T3 Code) — single-port dev. The script
    # builds the web bundle once into apps/flowstarter-editor/web/dist
    # and then runs the Bun server on :5773 (overriding T3's upstream
    # default of 3773 to avoid colliding with the local T3 Code Electron
    # app, which already binds 3773). The server serves both the API and
    # the bundled UI from that origin. For web hot-reload while actively
    # editing React/CSS, run `pnpm dev:editor:full` separately (parallel
    # server :5773 + Vite :5733, with the vite proxy pointing at 5773).
    #
    # Needs ANTHROPIC_API_KEY (already in editor/server/.env); Clerk +
    # Supabase keys are optional during dev — without them, append
    # ?clerk-skip=true to the URL to fall back to T3's manual pairing.
    shell: "pnpm dev:editor"
    autostart: true

  "🎨 Dorin Portfolio":
    # The canonical demo client site — Dorin's hand-crafted Astro
    # portfolio template. Served by Astro dev on :4321, used as the
    # editor's demo workspace and as the live preview captured for the
    # landing showcase.
    shell: "pnpm --dir apps/flowstarter-templates/dorin-portfolio dev"
    autostart: false
