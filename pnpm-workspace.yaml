packages:
  - apps/*
  - apps/flowstarter-library/*
  - apps/t3-code/server
  - apps/t3-code/web
  - apps/t3-code/packages/*
  - packages/*

# Catalog mirrors the upstream T3 bun catalog so `catalog:` specifiers inside
# the apps/t3-code/* packages resolve under pnpm. Keep these versions in sync
# with the upstream t3code repo.
catalog:
  effect: 4.0.0-beta.50
  '@effect/atom-react': 4.0.0-beta.50
  '@effect/platform-bun': 4.0.0-beta.50
  '@effect/platform-node': 4.0.0-beta.50
  '@effect/sql-sqlite-bun': 4.0.0-beta.50
  '@effect/vitest': 4.0.0-beta.50
  '@effect/language-service': 0.84.2
  '@types/bun': ^1.3.9
  '@types/node': ^24.10.13
  tsdown: ^0.20.3
  typescript: ^5.7.3
  vitest: ^4.0.0
